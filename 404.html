<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 블레스바디</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #0f1117; color: #e1e3e8; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
        .box { background: #161821; border: 1px solid #2a2d37; padding: 40px 30px; border-radius: 12px; max-width: 480px; width: 100%; }
        h1 { font-size: 3rem; color: #d4af37; margin-bottom: 10px; }
        p { font-size: 0.95rem; color: #bbb; margin-bottom: 25px; line-height: 1.6; }
        a { display: inline-block; background: #d4af37; color: #111; font-weight: bold; text-decoration: none; padding: 12px 25px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>아래 버튼을 눌러 메인 화면으로 이동해주세요.</p>
        <a href="/">블레스바디 홈으로 이동</a>
    </div>
</body>
</html>
